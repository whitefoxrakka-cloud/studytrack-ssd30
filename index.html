<!DOCTYPE html>
<html lang="id" data-tema="gelap">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="color-scheme" content="dark light">
<meta name="description" content="StudyTrack — aplikasi analisis kebiasaan belajar mahasiswa dengan K-Means clustering. Catat sesi belajar, lihat polamu, dapatkan saran yang terukur.">
<title>StudyTrack — Analisis Kebiasaan Belajar</title>
<link rel="canonical" href="https://whitefoxrakka-cloud.github.io/studytrack-ssd30/">

<meta property="og:type" content="website">
<meta property="og:title" content="StudyTrack — Analisis Kebiasaan Belajar Mahasiswa">
<meta property="og:description" content="Catat sesi belajar, lihat pola kebiasaanmu lewat K-Means clustering, dapatkan saran yang terukur.">
<meta property="og:image" content="assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="assets/ikon.svg">
<link rel="apple-touch-icon" href="assets/img/ikon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- latar kota futuristik: diisi oleh kota.js -->
<div id="kota" aria-hidden="true"></div>

<!-- layar muat -->
<div id="muat" role="status" aria-live="polite" aria-label="Memuat aplikasi">
  <div class="muat-kartu">
    <div class="muat-logo" aria-hidden="true">STUDY<span>TRACK</span></div>
    <div class="muat-label">Sistem analisis kebiasaan belajar</div>
    <div class="muat-bar"><i></i></div>
    <div class="muat-log" id="muatLog">memuat dataset survei</div>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 3.4 26.2 9.2v13.6L16 28.6 5.8 22.8V9.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" opacity=".45"/>
          <path d="M11.2 20.2v-5M16 20.2V10.4M20.8 20.2v-3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="16" cy="6.8" r="1.7" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>Study<span>Track</span></h1>
        <p id="tanggal">—</p>
      </div>
    </div>
    <div class="topbar-aksi">
      <button class="icon-tombol" data-act="tema" id="btnTema" title="Ganti tema" aria-label="Ganti tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z"/></svg>
      </button>
      <button class="icon-tombol" data-act="atur" title="Pengaturan" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.9v2.7M12 18.4v2.7M2.9 12h2.7M18.4 12h2.7M5.6 5.6l1.9 1.9M16.5 16.5l1.9 1.9M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9"/></svg>
      </button>
    </div>
  </header>
  <main id="isi"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Navigasi utama"></nav>

<button id="nora" data-act="nora" title="Nora — asisten kecil" aria-label="Tanya Nora">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="cincin-holo" cx="60" cy="62" r="47" fill="none" stroke="#22d3ee" stroke-width=".9" stroke-dasharray="3 8" opacity=".5"/>
    <g class="badan-holo">
      <path d="M34 96V58a26 26 0 0 1 52 0v38q-6.5-8-13 0-6.5 8-13 0-6.5-8-13 0-6.5 8-13 0Z" fill="rgba(8,16,32,.88)" stroke="#22d3ee" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M34 96V58a26 26 0 0 1 52 0v38q-6.5-8-13 0-6.5 8-13 0-6.5-8-13 0-6.5 8-13 0Z" fill="none" stroke="#ff2d95" stroke-width="1" opacity=".45" transform="translate(1.8 1.8)"/>
      <g class="mata">
        <rect x="43" y="52" width="11" height="6.4" rx="3.2" fill="#22d3ee"/>
        <rect x="66" y="52" width="11" height="6.4" rx="3.2" fill="#22d3ee"/>
      </g>
      <path d="M52 68h16" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
      <path d="M60 32V20" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="60" cy="17" r="3.4" fill="#ff2d95"/>
    </g>
  </svg>
</button>
<div id="noraGelembung" role="status" aria-live="polite"></div>
<div id="tumpah" aria-hidden="true"></div>
<div id="toastWadah" aria-live="polite"></div>

<script src="assets/js/dataset.js"></script>
<script src="assets/js/kmeans.js"></script>
<script src="assets/js/ikon.js"></script>
<script src="assets/js/grafik.js"></script>
<script src="assets/js/animasi.js"></script>
<script src="assets/js/kota.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
