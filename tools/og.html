<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>OG image StudyTrack</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#04060f;color:#e6edff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    position:relative;
  }
  .langit{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 50% 120%,rgba(255,45,149,.22),transparent 60%),
      radial-gradient(80% 70% at 8% 0%,rgba(34,211,238,.18),transparent 58%),
      radial-gradient(70% 60% at 96% 4%,rgba(124,92,255,.22),transparent 60%),
      linear-gradient(180deg,#05070f,#070b18 46%,#0a1020 76%,#120a1c);
  }
  .kisi{
    position:absolute;inset:0;
    background-image:
      linear-gradient(90deg,rgba(34,211,238,.09) 1px,transparent 1px),
      linear-gradient(180deg,rgba(34,211,238,.09) 1px,transparent 1px);
    background-size:100px 100px;
    mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 78%);
  }
  .bintang{position:absolute;inset:0}
  .bintang i{position:absolute;background:#cfe6ff;border-radius:50%}
  .bulan{
    position:absolute;right:88px;top:52px;width:118px;height:118px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#fff,rgba(255,45,149,.45) 42%,rgba(34,211,238,.14) 68%,transparent 72%);
    box-shadow:0 0 60px rgba(255,45,149,.3),0 0 130px rgba(34,211,238,.18);
  }
  .bulan::after{content:"";position:absolute;inset:-20px;border-radius:50%;border:1px dashed rgba(34,211,238,.35)}

  /* kota */
  .kota{position:absolute;left:0;right:0;bottom:0;height:250px;opacity:.85}
  .kota svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
  .kabut{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(180deg,transparent,#04060f 88%)}

  .isi{position:relative;padding:74px 80px;display:flex;gap:34px;align-items:flex-start}
  .logo{
    width:118px;height:118px;border-radius:26px;flex:0 0 auto;
    background:linear-gradient(140deg,rgba(34,211,238,.16),rgba(124,92,255,.16));
    border:1px solid rgba(34,211,238,.5);
    box-shadow:0 0 40px rgba(34,211,238,.28),inset 0 0 30px rgba(34,211,238,.1);
    display:grid;place-items:center;
  }
  .logo svg{width:70px;height:70px}
  .teks{min-width:0}
  h1{
    font:800 62px/1 ui-monospace,"SF Mono",Consolas,monospace;
    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  }
  h1 span{color:#22d3ee;text-shadow:0 0 26px rgba(34,211,238,.7)}
  .sub{
    margin-top:16px;font:700 15px/1.5 ui-monospace,Consolas,monospace;
    letter-spacing:.22em;text-transform:uppercase;color:#8492b4;
  }
  .desk{margin-top:20px;font-size:21px;line-height:1.5;color:#c3cfe8;max-width:760px}
  .chip{display:flex;gap:12px;margin-top:30px}
  .chip b{
    font:800 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;
    padding:10px 16px;border-radius:8px;border:1px solid rgba(34,211,238,.35);
    background:rgba(34,211,238,.07);color:#9fe8ff;
  }
  .chip b.p{border-color:rgba(255,45,149,.4);background:rgba(255,45,149,.08);color:#ff9ecb}
</style>
</head>
<body>
  <div class="langit"></div>
  <div class="kisi"></div>
  <div class="bintang" id="bintang"></div>
  <div class="bulan"></div>

  <div class="kota">
    <svg viewBox="0 0 1200 250" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g fill="#0a1122">
        <rect x="-10" y="120" width="70" height="140"/><rect x="66" y="86" width="54" height="174"/>
        <rect x="126" y="150" width="80" height="110"/><rect x="212" y="70" width="48" height="190"/>
        <rect x="266" y="132" width="66" height="128"/><rect x="338" y="98" width="58" height="162"/>
        <rect x="402" y="158" width="76" height="102"/><rect x="484" y="80" width="50" height="180"/>
        <rect x="540" y="140" width="72" height="120"/><rect x="618" y="60" width="46" height="200"/>
        <rect x="670" y="126" width="84" height="134"/><rect x="760" y="96" width="54" height="164"/>
        <rect x="820" y="152" width="70" height="108"/><rect x="896" y="74" width="48" height="186"/>
        <rect x="950" y="134" width="78" height="126"/><rect x="1034" y="100" width="56" height="160"/>
        <rect x="1096" y="150" width="70" height="110"/><rect x="1172" y="88" width="44" height="172"/>
      </g>
      <g fill="#3a6a94" opacity=".85">
        <rect x="8" y="140" width="4" height="5"/><rect x="24" y="156" width="4" height="5"/><rect x="40" y="176" width="4" height="5"/>
        <rect x="76" y="104" width="4" height="5"/><rect x="92" y="126" width="4" height="5"/><rect x="76" y="150" width="4" height="5"/>
        <rect x="222" y="90" width="4" height="5"/><rect x="238" y="112" width="4" height="5"/><rect x="222" y="140" width="4" height="5"/>
        <rect x="494" y="100" width="4" height="5"/><rect x="510" y="124" width="4" height="5"/><rect x="494" y="152" width="4" height="5"/>
        <rect x="628" y="80" width="4" height="5"/><rect x="644" y="104" width="4" height="5"/><rect x="628" y="134" width="4" height="5"/>
        <rect x="906" y="94" width="4" height="5"/><rect x="922" y="118" width="4" height="5"/><rect x="906" y="146" width="4" height="5"/>
        <rect x="1044" y="120" width="4" height="5"/><rect x="1060" y="146" width="4" height="5"/>
      </g>
      <g>
        <rect x="150" y="172" width="34" height="6" rx="1" fill="#ff2d95" opacity=".8"/>
        <rect x="352" y="120" width="30" height="6" rx="1" fill="#22d3ee" opacity=".8"/>
        <rect x="700" y="148" width="40" height="6" rx="1" fill="#ffb020" opacity=".75"/>
        <rect x="972" y="156" width="36" height="6" rx="1" fill="#2ee6a8" opacity=".7"/>
      </g>
    </svg>
  </div>
  <div class="kabut"></div>

  <div class="isi">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2.6 19.6 7v10L12 21.4 4.4 17V7z" stroke="#22d3ee" stroke-width="1.1" stroke-linejoin="round" opacity=".75"/>
        <path d="M8.6 15.6v-3.2M12 15.6V9.4M15.4 15.6v-2.2" stroke="#22d3ee" stroke-width="1.9" stroke-linecap="round"/>
        <circle cx="12" cy="5" r="1.3" fill="#ff2d95"/>
      </svg>
    </div>
    <div class="teks">
      <h1>Study<span>Track</span></h1>
      <div class="sub">Analisis kebiasaan belajar · K-Means</div>
      <p class="desk">Catat sesi belajar, lihat polamu lewat K-Means clustering, dan dapatkan saran yang terukur.</p>
      <div class="chip">
        <b>6 fitur</b><b>90 responden</b><b class="p">k = 3</b><b>silhouette 0,36</b>
      </div>
    </div>
  </div>

  <script>
    const w = document.getElementById("bintang");
    let bibit = 991;
    const acak = () => ((bibit = (bibit * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    let html = "";
    for (let i = 0; i < 70; i++) {
      const s = 1 + acak() * 2.2;
      html += '<i style="left:' + (acak() * 1200).toFixed(0) + "px;top:" + (acak() * 380).toFixed(0) +
        "px;width:" + s.toFixed(1) + "px;height:" + s.toFixed(1) + "px;opacity:" + (0.2 + acak() * 0.7).toFixed(2) + '"></i>';
    }
    w.innerHTML = html;
  </script>
</body>
</html>
