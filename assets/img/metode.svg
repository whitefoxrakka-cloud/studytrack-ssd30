<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Alur metode: data, standardisasi, K-Means, tiga cluster">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7bff"/><stop offset="1" stop-color="#6d4aff"/></linearGradient>
    <marker id="panah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#c9bcff"/>
    </marker>
  </defs>

  <!-- 1 data -->
  <g transform="translate(8,44)">
    <rect width="120" height="112" rx="16" fill="#6d4aff" opacity=".08"/>
    <rect x="18" y="20" width="84" height="9" rx="4.5" fill="#c9bcff"/>
    <rect x="18" y="40" width="64" height="7" rx="3.5" fill="#e6ddff"/>
    <rect x="18" y="56" width="72" height="7" rx="3.5" fill="#e6ddff"/>
    <rect x="18" y="72" width="56" height="7" rx="3.5" fill="#e6ddff"/>
    <text x="60" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#6d4aff">data mentah</text>
  </g>
  <line x1="136" y1="100" x2="160" y2="100" stroke="#c9bcff" stroke-width="2.4" marker-end="url(#panah)"/>

  <!-- 2 z-score -->
  <g transform="translate(168,44)">
    <rect width="120" height="112" rx="16" fill="#ff7ab8" opacity=".1"/>
    <text x="60" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#241f3a">z =</text>
    <text x="60" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#241f3a">(x − μ) / σ</text>
    <text x="60" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#e8577d">standardisasi</text>
  </g>
  <line x1="296" y1="100" x2="320" y2="100" stroke="#c9bcff" stroke-width="2.4" marker-end="url(#panah)"/>

  <!-- 3 kmeans -->
  <g transform="translate(328,44)">
    <rect width="120" height="112" rx="16" fill="#4f8dfd" opacity=".1"/>
    <g fill="#4f8dfd" opacity=".55">
      <circle cx="34" cy="42" r="3.4"/><circle cx="48" cy="34" r="3.4"/><circle cx="42" cy="50" r="3.4"/>
      <circle cx="84" cy="52" r="3.4"/><circle cx="94" cy="42" r="3.4"/><circle cx="76" cy="64" r="3.4"/>
      <circle cx="56" cy="74" r="3.4"/><circle cx="68" cy="82" r="3.4"/>
    </g>
    <g fill="#6d4aff">
      <circle cx="42" cy="42" r="6"/><circle cx="85" cy="53" r="6"/><circle cx="62" cy="78" r="6"/>
    </g>
    <text x="60" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#2a5bb0">K-Means</text>
  </g>
  <line x1="456" y1="100" x2="480" y2="100" stroke="#c9bcff" stroke-width="2.4" marker-end="url(#panah)"/>

  <!-- 4 hasil -->
  <g transform="translate(488,44)">
    <rect width="144" height="112" rx="16" fill="#22c39a" opacity=".1"/>
    <g>
      <rect x="18" y="26" width="108" height="14" rx="7" fill="#6d4aff"/>
      <rect x="18" y="46" width="86" height="14" rx="7" fill="#f5a524"/>
      <rect x="18" y="66" width="62" height="14" rx="7" fill="#ef5b7d"/>
    </g>
    <text x="72" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#137a56">3 kelompok</text>
  </g>
</svg>
