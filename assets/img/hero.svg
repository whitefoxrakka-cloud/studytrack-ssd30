<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="Ilustrasi meja belajar">
  <defs>
    <linearGradient id="buku1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="buku2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ab8"/><stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="buku3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="kaca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#dff6ff" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- lingkaran latar -->
  <circle cx="212" cy="164" r="126" fill="#7c5cff" opacity=".07"/>
  <circle cx="212" cy="164" r="92" fill="#ff2d95" opacity=".07"/>

  <!-- tumpukan buku -->
  <g>
    <rect x="96" y="238" width="228" height="26" rx="10" fill="url(#buku3)"/>
    <rect x="112" y="230" width="196" height="14" rx="7" fill="#ffffff" opacity=".55"/>
    <rect x="104" y="208" width="212" height="26" rx="10" fill="url(#buku2)"/>
    <rect x="120" y="200" width="180" height="14" rx="7" fill="#ffffff" opacity=".5"/>
    <rect x="112" y="178" width="196" height="26" rx="10" fill="url(#buku1)"/>
    <rect x="128" y="170" width="164" height="14" rx="7" fill="#ffffff" opacity=".45"/>
  </g>

  <!-- buku terbuka -->
  <g transform="translate(0,-6)">
    <path d="M212 96c-26-16-62-18-84-10v96c22-8 58-6 84 10z" fill="url(#kaca)" stroke="#a5f3fc" stroke-width="3" stroke-linejoin="round"/>
    <path d="M212 96c26-16 62-18 84-10v96c-22-8-58-6-84 10z" fill="url(#kaca)" stroke="#a5f3fc" stroke-width="3" stroke-linejoin="round"/>
    <path d="M212 96v96" stroke="#a5f3fc" stroke-width="3"/>
    <path d="M146 112c14-4 32-3 46 4M146 130c14-4 32-3 46 4M146 148c14-4 32-3 46 4" stroke="#cbe9ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M228 116c14-7 32-8 46-4M228 134c14-7 32-8 46-4M228 152c14-7 32-8 46-4" stroke="#cbe9ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- grafik mengapung -->
  <g opacity=".95">
    <rect x="292" y="150" width="14" height="34" rx="7" fill="#7c5cff"/>
    <rect x="312" y="132" width="14" height="52" rx="7" fill="#ff2d95"/>
    <rect x="332" y="112" width="14" height="72" rx="7" fill="#2ee6a8"/>
  </g>

  <!-- kilau -->
  <g fill="#ffb020">
    <path d="M96 108l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity=".9"/>
    <path d="M330 74l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".75"/>
